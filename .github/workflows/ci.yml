name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Next.js 16 requires Node.js >= 20.9.0 (the 18.x job failed
        # with "For Next.js, Node.js version \">=20.9.0\" is required"
        # on 2026-09-04). Drop 18.x and pin to 20.x; bump to 22.x
        # once Vitest 4.1.10's >=22.12.0 engine requirement matters.
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint --if-present
      
    - name: Build
      run: npm run build --if-present
