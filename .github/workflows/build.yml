name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Skip requiring actual API keys during build
          # The app falls back to mock mode when keys are absent
          AI_PROVIDER: mock

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Build output .next/ not found"
            exit 1
          fi
          echo "✓ Build successful — .next/ directory present"
